name: Build srcds-autocomplete

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/build.yml
      - scripts/**
      - Makefile
      - .gitattributes
      - scripts/package/package-map.json
      - configure.py
      - AMBuildScript
      - AMBuilder
      - PackageScript
      - extension/**
      - addons/**
      - tests/**
      - README.md
      - LICENSE
      - docs/**
  workflow_dispatch:

concurrency:
  group: srcds-autocomplete-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deps-exts-linux:
    runs-on: ubuntu-22.04
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv make gcc-multilib g++-multilib clang

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=exts-linux-deps-${{ runner.os }}-${{ hashFiles('scripts/deps/fetch-linux-deps.sh', 'scripts/build/build-linux-l4d2.sh', 'scripts/package/stage-artifact.py', 'scripts/package/package-release.py', 'scripts/package/package-map.json', 'Makefile', 'configure.py', 'AMBuildScript', 'PackageScript') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-linux
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch Linux extension dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        shell: bash
        run: make deps-exts-linux

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/exts-linux
          key: ${{ steps.cache-key.outputs.key }}

  build-exts-linux:
    runs-on: ubuntu-22.04
    needs: deps-exts-linux
    outputs:
      basename: ${{ steps.artifact.outputs.basename }}
      release-tag: ${{ steps.artifact.outputs.release_tag }}
      release-name: ${{ steps.artifact.outputs.release_name }}
      prerelease: ${{ steps.artifact.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv make gcc-multilib g++-multilib clang

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-linux
          key: ${{ needs.deps-exts-linux.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build Linux extension
        shell: bash
        run: make build-exts-linux

      - name: Resolve Linux artifact metadata
        id: artifact
        shell: bash
        env:
          AOC_REF_TYPE: ${{ github.ref_type }}
          AOC_REF_NAME: ${{ github.ref_name }}
          AOC_COMMIT_SHA: ${{ github.sha }}
        run: |
          make --no-print-directory release-identity-linux > identity.json
          python - <<'PYCODE'
          import json, os
          data = json.load(open("identity.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              value = data["basename"]
              print("basename=" + (str(value).lower() if isinstance(value, bool) else str(value or "")), file=out)
              value = data["release_tag"]
              print("release_tag=" + (str(value).lower() if isinstance(value, bool) else str(value or "")), file=out)
              value = data["release_name"]
              print("release_name=" + (str(value).lower() if isinstance(value, bool) else str(value or "")), file=out)
              value = data["prerelease"]
              print("prerelease=" + (str(value).lower() if isinstance(value, bool) else str(value or "")), file=out)
          PYCODE

      - name: Upload Linux build tree
        uses: actions/upload-artifact@v7
        with:
          name: exts-build-linux
          path: .build/linux-l4d2
          if-no-files-found: error
          retention-days: 1

  release-linux:
    runs-on: ubuntu-22.04
    needs: build-exts-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make

      - name: Download Linux build tree
        uses: actions/download-artifact@v8
        with:
          name: exts-build-linux
          path: .build/linux-l4d2

      - name: Package Linux extension tree
        run: make package-exts-linux

      - name: Create Linux release zip
        run: make release-linux RELEASE_BASENAME="${{ needs.build-exts-linux.outputs.basename }}"

      - name: Validate Linux artifact
        run: make validate-artifact-linux RELEASE_BASENAME="${{ needs.build-exts-linux.outputs.basename }}"

      - name: Upload Linux release zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.build-exts-linux.outputs.basename }}
          path: dist/release/${{ needs.build-exts-linux.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  deps-exts-windows:
    runs-on: windows-2022
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=exts-windows-deps-${{ runner.os }}-${{ hashFiles('scripts/deps/fetch-windows-deps.ps1', 'scripts/build/build-windows-l4d2.ps1', 'scripts/package/stage-artifact.py', 'scripts/package/package-release.py', 'scripts/package/package-map.json', 'Makefile', 'configure.py', 'AMBuildScript', 'PackageScript') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-windows
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch Windows extension dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: make deps-exts-windows

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/exts-windows
          key: ${{ steps.cache-key.outputs.key }}

  build-exts-windows:
    runs-on: windows-2022
    needs: deps-exts-windows
    outputs:
      basename: ${{ steps.artifact.outputs.basename }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/exts-windows
          key: ${{ needs.deps-exts-windows.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build Windows extension
        shell: pwsh
        run: make build-exts-windows

      - name: Resolve Windows artifact metadata
        id: artifact
        shell: bash
        env:
          AOC_REF_TYPE: ${{ github.ref_type }}
          AOC_REF_NAME: ${{ github.ref_name }}
          AOC_COMMIT_SHA: ${{ github.sha }}
        run: |
          make --no-print-directory release-identity-windows > identity.json
          python - <<'PYCODE'
          import json, os
          data = json.load(open("identity.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              value = data["basename"]
              print("basename=" + (str(value).lower() if isinstance(value, bool) else str(value or "")), file=out)
          PYCODE

      - name: Upload Windows build tree
        uses: actions/upload-artifact@v7
        with:
          name: exts-build-windows
          path: .build/windows-l4d2
          if-no-files-found: error
          retention-days: 1

  release-windows:
    runs-on: windows-2022
    needs: build-exts-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Windows build tree
        uses: actions/download-artifact@v8
        with:
          name: exts-build-windows
          path: .build/windows-l4d2

      - name: Package Windows extension tree
        shell: pwsh
        run: make package-exts-windows

      - name: Create Windows release zip
        shell: pwsh
        run: make release-windows RELEASE_BASENAME="${{ needs.build-exts-windows.outputs.basename }}"

      - name: Validate Windows artifact
        run: make validate-artifact-windows RELEASE_BASENAME="${{ needs.build-exts-windows.outputs.basename }}"

      - name: Upload Windows release zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.build-exts-windows.outputs.basename }}
          path: dist/release/${{ needs.build-exts-windows.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: make test-ci TEST_OUTPUT=.build/test-ci

  publish:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: [test, build-exts-linux, build-exts-windows, release-linux, release-windows]
    if: github.event_name != 'pull_request' && ((github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'develop')) || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Linux release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-exts-linux.outputs.basename }}
          path: dist/release

      - name: Download Windows release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-exts-windows.outputs.basename }}
          path: dist/release

      - name: Move channel tag
        if: github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'develop')
        shell: bash
        run: |
          test -f 'dist/release/${{ needs.build-exts-linux.outputs.basename }}.zip'
          test -f 'dist/release/${{ needs.build-exts-windows.outputs.basename }}.zip'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ needs.build-exts-linux.outputs.release-tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ needs.build-exts-linux.outputs.release-tag }}" --force

      - name: Publish channel release
        if: github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'develop')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ needs.build-exts-linux.outputs.release-tag }}"
          title="${{ needs.build-exts-linux.outputs.release-name }}"
          linux_asset="dist/release/${{ needs.build-exts-linux.outputs.basename }}.zip"
          windows_asset="dist/release/${{ needs.build-exts-windows.outputs.basename }}.zip"
          test -f "$linux_asset"
          test -f "$windows_asset"
          gh release list --limit 100 --json tagName > releases.json
          date_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > channel-notes.md <<EOF
          Actualización del canal $title.
          Fecha de actualización (UTC): $date_utc
          Commit: $GITHUB_SHA
          Ejecución de CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (intento $GITHUB_RUN_ATTEMPT)
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --draft --title "$title" --notes-file channel-notes.md --target "$GITHUB_SHA"
          gh release upload "$tag" "$linux_asset" "$windows_asset"
          if [[ "${{ needs.build-exts-linux.outputs.prerelease }}" == "true" ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi

      - name: Publish tagged release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          title="${{ needs.build-exts-linux.outputs.release-name }}"
          linux_asset="dist/release/${{ needs.build-exts-linux.outputs.basename }}.zip"
          windows_asset="dist/release/${{ needs.build-exts-windows.outputs.basename }}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --latest
          else
            gh release create "$tag" --title "$title" --verify-tag --latest
          fi
          gh release upload "$tag" "$linux_asset" "$windows_asset" --clobber
